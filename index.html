<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦境宇宙 · DreamVerse</title>
<style>
:root{--bg:#1d1830;--fg:#ece8f5;--muted:#a99fc4;--line:#3a3358;--accent:#7a5a9e;--soft:#2a2444;--card:#241f3c}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);font-size:15px}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--soft);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--soft);color:var(--fg);padding:7px 12px;border-radius:8px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{background:transparent}
.layout{display:flex;min-height:calc(100vh - 53px)}
aside{width:200px;border-right:1px solid var(--line);padding:12px;overflow:auto}
aside h3{font-size:12px;color:var(--muted);margin:0 0 8px}
.wrow{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;margin-bottom:6px;cursor:pointer;border:1px solid transparent}
.wrow.active{background:var(--card);border-color:var(--line)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
main{flex:1;padding:16px;overflow:auto}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:8px 14px;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--soft);cursor:pointer}
.tab.active{background:var(--card);color:#fff}
.panel{display:none}.panel.active{display:block}
.search{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--fg);margin-bottom:10px}
.count{font-size:12px;color:var(--muted);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.item h4{margin:0 0 6px;font-size:15px}
.item p{margin:0;color:var(--muted);font-size:13px;white-space:pre-wrap;max-height:60px;overflow:hidden}
.item img{width:100%;height:90px;object-fit:cover;border-radius:6px;margin-top:8px}
.badge{display:inline-block;font-size:11px;color:var(--accent);margin-top:8px}
.overlay{position:fixed;inset:0;background:rgba(10,8,20,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.show{display:flex}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:12px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:16px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal input[type=text],.modal textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--fg);font:inherit}
.modal textarea{min-height:90px;resize:vertical}
.modal input:disabled,.modal textarea:disabled{opacity:.8}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.link-item{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--soft);cursor:pointer}
.link-item.jump{color:var(--accent);border-color:var(--accent)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.read-controls{margin-top:14px}
.imgprev{margin-top:8px}.imgprev img{max-width:100%;max-height:160px;border-radius:8px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>梦境宇宙 · DreamVerse</h1>
  <button class="ghost" id="addWorld">+ 世界</button>
</header>
<div class="layout">
  <aside>
    <h3>我的世界</h3>
    <div id="worldList"></div>
  </aside>
  <main>
    <div class="tabs">
      <div class="tab active" data-tab="frag">梦境碎片</div>
      <div class="tab" data-tab="wv">世界观</div>
      <div class="tab" data-tab="el">要素库</div>
    </div>
    <div class="panel active" id="panel-frag">
      <button class="primary" id="addFrag">+ 新建碎片</button>
      <div class="grid" id="fragGrid" style="margin-top:14px"></div>
    </div>
    <div class="panel" id="panel-wv">
      <input class="search" id="wvSearch" placeholder="搜索世界观卡片（标题/内容/分类）">
      <div class="count" id="wvCount"></div>
      <button class="primary" id="addCard">+ 新建设定卡</button>
      <div class="grid" id="wvGrid" style="margin-top:14px"></div>
    </div>
    <div class="panel" id="panel-el">
      <input class="search" id="elSearch" placeholder="搜索要素（名称/类型/描述/出处）">
      <div class="count" id="elCount"></div>
      <button class="primary" id="addElem">+ 新建要素</button>
      <div class="grid" id="elGrid" style="margin-top:14px"></div>
    </div>
  </main>
</div>

<div class="overlay" id="ov">
  <div class="modal" id="modal"></div>
</div>

<script>
var KEY='dreamverse-v1';
var state={worlds:[]}, cur=null, tab='frag';
var editing=false, draft=null, imgData='';

function $(s){return document.querySelector(s)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){try{var s=localStorage.getItem(KEY);if(s)state=JSON.parse(s)}catch(e){}}
function world(){return state.worlds.find(function(w){return w.id===cur})}

function applyTheme(w){
  if(!w)return;
  document.documentElement.style.setProperty('--accent',w.color);
}
function esc(t){return (t||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}

function renderWorlds(){
  var box=$('#worldList');box.innerHTML='';
  if(!state.worlds.length){box.innerHTML='<div class="empty">还没有世界</div>';return}
  state.worlds.forEach(function(w){
    var d=document.createElement('div');
    d.className='wrow'+(w.id===cur?' active':'');
    d.innerHTML='<span class="dot" style="background:'+w.color+'"></span><span>'+esc(w.name)+'</span>';
    d.onclick=function(){cur=w.id;applyTheme(w);editing=false;renderAll()};
    box.appendChild(d);
  });
}

function renderGrid(){
  var w=world();
  if(!w){['fragGrid','wvGrid','elGrid'].forEach(function(id){$('#'+id).innerHTML='<div class="empty">先在左侧选择一个世界</div>'});return}
  // fragments
  $('#fragGrid').innerHTML=w.fragments.length?w.fragments.map(function(f){
    return '<div class="item" data-f="'+f.id+'"><h4>'+esc(f.title||'无题')+'</h4><p>'+esc(f.content||'')+'</p></div>'
  }).join(''):'<div class="empty">还没有碎片，点上方新建</div>';
  // worldview with search
  var qw=$('#wvSearch').value.trim().toLowerCase();
  var cards=w.cards.filter(function(c){
    if(!qw)return true;return (c.title+' '+c.content+' '+(c.category||'')).toLowerCase().indexOf(qw)>=0;
  });
  $('#wvCount').textContent='匹配 '+cards.length+' / '+w.cards.length+' 张';
  $('#wvGrid').innerHTML=cards.length?cards.map(function(c){
    var img=c.image?'<img src="'+c.image+'">':'';
    var frag=w.fragments.find(function(f){return (f.links&&f.links.cards||[]).indexOf(c.id)>=0});
    var badge=frag?'<span class="badge">关联碎片 ↗</span>':'';
    return '<div class="item" data-c="'+c.id+'"><h4>'+esc(c.title||'无题')+'</h4><p>'+(c.category?'['+esc(c.category)+'] ':'')+esc(c.content||'')+'</p>'+img+badge+'</div>'
  }).join(''):'<div class="empty">还没有设定卡</div>';
  // elements with search
  var qe=$('#elSearch').value.trim().toLowerCase();
  var els=w.elements.filter(function(e){
    if(!qe)return true;return (e.name+' '+e.type+' '+e.desc+' '+(e.source||'')).toLowerCase().indexOf(qe)>=0;
  });
  $('#elCount').textContent='匹配 '+els.length+' / '+w.elements.length+' 个';
  $('#elGrid').innerHTML=els.length?els.map(function(e){
    var img=e.image?'<img src="'+e.image+'">':'';
    var frag=w.fragments.find(function(f){return (f.links&&f.links.elements||[]).indexOf(e.id)>=0});
    var badge=frag?'<span class="badge">关联碎片 ↗</span>':'';
    return '<div class="item" data-e="'+e.id+'"><h4>'+esc(e.name||'无题')+'</h4><p>'+(e.type?'['+esc(e.type)+'] ':'')+esc(e.desc||'')+'</p>'+img+badge+'</div>'
  }).join(''):'<div class="empty">还没有要素</div>';
}

function renderAll(){renderWorlds();renderGrid()}

// ---- editor ----
function openEditor(html){
  $('#modal').innerHTML=html;
  $('#ov').classList.add('show');
  var imgp=$('#imgPrev');if(imgp&&imgData){imgp.innerHTML='<img src="'+imgData+'">'} 
  setRead();
}
function setRead(){
  if(editing){$('.read-controls')&&($('.read-controls').style.display='none');}
  var m=$('#modal');
  m.querySelectorAll('input[type=text],textarea').forEach(function(el){el.disabled=!editing});
  m.querySelectorAll('input[type=file]').forEach(function(el){el.disabled=!editing});
  m.querySelectorAll('.link-item input[type=checkbox]').forEach(function(el){el.disabled=!editing});
  var rc=m.querySelector('.read-controls');if(rc)rc.style.display=editing?'none':'block';
  var ec=m.querySelector('.edit-controls');if(ec)ec.style.display=editing?'flex':'none';
}
function closeEditor(){$('#ov').classList.remove('show');editing=false;draft=null;imgData=''}

function field(label,name,val,ph){
  return '<label>'+label+'</label><input type="text" data-f="'+name+'" value="'+esc(val||'')+'"'+(editing?'':' disabled')+(ph?' placeholder="'+ph+'"':'')+'>';
}
function area(label,name,val){
  return '<label>'+label+'</label><textarea data-f="'+name+'"'+(editing?'':' disabled')+'>'+esc(val||'')+'</textarea>';
}

function openFrag(id){
  var w=world();if(!w)return;
  var f=id?w.fragments.find(function(x){return x.id===id}):null;
  editing=!id;draft=f?JSON.parse(JSON.stringify(f)):{title:'',content:'',links:{cards:[],elements:[]}};
  if(!draft.links)draft.links={cards:[],elements:[]};
  var linkHtml='<label>关联设定卡 / 要素</label><div class="links">';
  w.cards.forEach(function(c){var on=draft.links.cards.indexOf(c.id)>=0;
    linkHtml+='<label class="link-item"><input type="checkbox" data-lc="'+c.id+'"'+(on?' checked':'')+(editing?'':' disabled')+'> '+esc(c.title)+'</label>'});
  w.elements.forEach(function(e){var on=draft.links.elements.indexOf(e.id)>=0;
    linkHtml+='<label class="link-item"><input type="checkbox" data-le="'+e.id+'"'+(on?' checked':'')+(editing?'':' disabled')+'> '+esc(e.name)+'</label>'});
  linkHtml+='</div>';
  var body='<h3>'+(id?'梦境碎片':'新建碎片')+'</h3>'+
    field('标题','title',draft.title,'给这片梦起个名')+
    area('内容','content',draft.content)+
    linkHtml+
    '<div class="read-controls"><button class="primary" id="editBtn">修改</button></div>'+
    '<div class="actions edit-controls" style="display:none"><button class="ghost" id="delBtn">删除</button><button class="ghost" id="cancelBtn">取消</button><button class="primary" id="saveBtn">保存</button></div>';
  openEditor(body);
  var rc=$('#modal').querySelector('.read-controls');if(rc)rc.style.display=editing?'none':'block';
  if(editing)$('#modal').querySelector('.edit-controls').style.display='flex';
  bindFrag(id);
}
function bindFrag(id){
  var m=$('#modal');
  if($('#editBtn'))$('#editBtn').onclick=function(){editing=true;setRead();
    var rc=m.querySelector('.read-controls');if(rc)rc.style.display='none';
    m.querySelector('.edit-controls').style.display='flex';};
  if($('#cancelBtn'))$('#cancelBtn').onclick=closeEditor;
  if($('#saveBtn'))$('#saveBtn').onclick=function(){
    var w=world();
    m.querySelectorAll('[data-f]').forEach(function(el){draft[el.dataset.f]=el.value});
    m.querySelectorAll('[data-lc]').forEach(function(el){var i=draft.links.cards.indexOf(el.dataset.lc);if(el.checked&&i<0)draft.links.cards.push(el.dataset.lc);if(!el.checked&&i>=0)draft.links.cards.splice(i,1)});
    m.querySelectorAll('[data-le]').forEach(function(el){var i=draft.links.elements.indexOf(el.dataset.le);if(el.checked&&i<0)draft.links.elements.push(el.dataset.le);if(!el.checked&&i>=0)draft.links.elements.splice(i,1)});
    if(id){var k=w.fragments.findIndex(function(x){return x.id===id});w.fragments[k]=draft;}else{draft.id=uid();w.fragments.push(draft);}
    save();closeEditor();renderGrid();
  };
  if($('#delBtn'))$('#delBtn').onclick=function(){if(!confirm('确定删除这片碎片？'))return;var w=world();w.fragments=w.fragments.filter(function(x){return x.id!==id});save();closeEditor();renderGrid();};
}

function linkedView(ids,kind){
  var w=world();var html='<div class="links">';
  ids.forEach(function(id){
    var o,label;
    if(kind==='f'){o=w.fragments.find(function(x){return x.id===id});label=o?o.title:'碎片';}
    else if(kind==='c'){o=w.cards.find(function(x){return x.id===id});label=o?o.title:'卡片';}
    else {o=w.elements.find(function(x){return x.id===id});label=o?o.name:'要素';}
    if(o)html+='<div class="link-item jump" data-jump="'+kind+':'+id+'">↗ '+esc(label)+'</div>';
  });
  return html+'</div>';
}

function openCard(id){
  var w=world();if(!w)return;
  var c=id?w.cards.find(function(x){return x.id===id}):null;
  editing=!id;draft=c?JSON.parse(JSON.stringify(c)):{title:'',category:'',content:'',image:''};imgData=draft.image||'';
  var linked=w.fragments.filter(function(f){return (f.links&&f.links.cards||[]).indexOf(draft.id)>=0}).map(function(f){return f.id});
  var body='<h3>'+(id?'设定卡':'新建设定卡')+'</h3>'+
    field('标题','title',draft.title)+field('分类','category',draft.category,'如：民俗 / 都市传说 / 科幻')+
    area('内容','content',draft.content)+
    '<label>图片（人物外貌 / 世界地图等）</label><input type="file" id="imgInput" accept="image/*"'+(editing?'':' disabled')+'>'+
    '<div class="imgprev" id="imgPrev"></div>'+
    (linked.length?'<label>关联碎片</label>'+linkedView(linked,'f'):'')+
    '<div class="read-controls"><button class="primary" id="editBtn">修改</button></div>'+
    '<div class="actions edit-controls" style="display:none"><button class="ghost" id="delBtn">删除</button><button class="ghost" id="cancelBtn">取消</button><button class="primary" id="saveBtn">保存</button></div>';
  openEditor(body);
  if($('#imgPrev')&&imgData)$('#imgPrev').innerHTML='<img src="'+imgData+'">';
  bindMedia();bindCard(id);
}
function openElem(id){
  var w=world();if(!w)return;
  var e=id?w.elements.find(function(x){return x.id===id}):null;
  editing=!id;draft=e?JSON.parse(JSON.stringify(e)):{name:'',type:'',desc:'',source:'',image:''};imgData=draft.image||'';
  var linked=w.fragments.filter(function(f){return (f.links&&f.links.elements||[]).indexOf(draft.id)>=0}).map(function(f){return f.id});
  var body='<h3>'+(id?'要素':'新建要素')+'</h3>'+
    field('名称','name',draft.name)+field('类型','type',draft.type,'如：人物 / 地点 / 物品')+
    area('描述','desc',draft.desc)+field('出处','source',draft.source)+
    '<label>图片</label><input type="file" id="imgInput" accept="image/*"'+(editing?'':' disabled')+'>'+
    '<div class="imgprev" id="imgPrev"></div>'+
    (linked.length?'<label>关联碎片</label>'+linkedView(linked,'f'):'')+
    '<div class="read-controls"><button class="primary" id="editBtn">修改</button></div>'+
    '<div class="actions edit-controls" style="display:none"><button class="ghost" id="delBtn">删除</button><button class="ghost" id="cancelBtn">取消</button><button class="primary" id="saveBtn">保存</button></div>';
  openEditor(body);
  if($('#imgPrev')&&imgData)$('#imgPrev').innerHTML='<img src="'+imgData+'">';
  bindMedia();bindElem(id);
}
function bindMedia(){
  var inp=$('#imgInput');if(inp)inp.onchange=function(){
    var f=inp.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){imgData=r.result;var p=$('#imgPrev');if(p)p.innerHTML='<img src="'+imgData+'">'};
    r.readAsDataURL(f);
  };
}
function bindCard(id){
  var m=$('#modal');
  if($('#editBtn'))$('#editBtn').onclick=function(){editing=true;setRead();m.querySelector('.read-controls').style.display='none';m.querySelector('.edit-controls').style.display='flex';};
  if($('#cancelBtn'))$('#cancelBtn').onclick=closeEditor;
  if($('#saveBtn'))$('#saveBtn').onclick=function(){var w=world();
    m.querySelectorAll('[data-f]').forEach(function(el){draft[el.dataset.f]=el.value});draft.image=imgData;
    if(id){var k=w.cards.findIndex(function(x){return x.id===id});w.cards[k]=draft;}else{draft.id=uid();w.cards.push(draft);}
    save();closeEditor();renderGrid();};
  if($('#delBtn'))$('#delBtn').onclick=function(){if(!confirm('确定删除这张卡？'))return;var w=world();w.cards=w.cards.filter(function(x){return x.id!==id});save();closeEditor();renderGrid();};
  bindJump();
}
function bindElem(id){
  var m=$('#modal');
  if($('#editBtn'))$('#editBtn').onclick=function(){editing=true;setRead();m.querySelector('.read-controls').style.display='none';m.querySelector('.edit-controls').style.display='flex';};
  if($('#cancelBtn'))$('#cancelBtn').onclick=closeEditor;
  if($('#saveBtn'))$('#saveBtn').onclick=function(){var w=world();
    m.querySelectorAll('[data-f]').forEach(function(el){draft[el.dataset.f]=el.value});draft.image=imgData;
    if(id){var k=w.elements.findIndex(function(x){return x.id===id});w.elements[k]=draft;}else{draft.id=uid();w.elements.push(draft);}
    save();closeEditor();renderGrid();};
  if($('#delBtn'))$('#delBtn').onclick=function(){if(!confirm('确定删除这个要素？'))return;var w=world();w.elements=w.elements.filter(function(x){return x.id!==id});save();closeEditor();renderGrid();};
  bindJump();
}
function bindJump(){
  $('#modal').querySelectorAll('[data-jump]').forEach(function(el){
    el.onclick=function(){var p=el.dataset.jump.split(':');if(!confirm('跳转到关联的'+(p[0]==='c'?'设定卡':p[0]==='e'?'要素':'碎片')+'？'))return;
      closeEditor();if(p[0]==='c')openCard(p[1]);else if(p[0]==='e')openElem(p[1]);else openFrag(p[1]);};
  });
}

// ---- events ----
$('#addWorld').onclick=function(){
  var name=prompt('世界名称：');if(!name)return;
  var color=prompt('主题色（十六进制，如 #7a5a9e）：','#7a5a9e')||'#7a5a9e';
  var w={id:uid(),name:name,color:color,fragments:[],cards:[],elements:[]};
  state.worlds.push(w);cur=w.id;save();applyTheme(w);renderAll();
};
$('#addFrag').onclick=function(){if(!world()){alert('请先创建并选择一个世界');return}openFrag()};
$('#addCard').onclick=function(){if(!world()){alert('请先创建并选择一个世界');return}openCard()};
$('#addElem').onclick=function(){if(!world()){alert('请先创建并选择一个世界');return}openElem()};
$('#wvSearch').oninput=renderGrid;
$('#elSearch').oninput=renderGrid;
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){tab=t.dataset.tab;document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});t.classList.add('active');document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});$('#panel-'+tab).classList.add('active');}});
$('#fragGrid').onclick=function(e){var it=e.target.closest('[data-f]');if(it)openFrag(it.dataset.f)};
$('#wvGrid').onclick=function(e){var it=e.target.closest('[data-c]');if(it)openCard(it.dataset.c)};
$('#elGrid').onclick=function(e){var it=e.target.closest('[data-e]');if(it)openElem(it.dataset.e)};
$('#ov').onclick=function(e){if(e.target.id==='ov')closeEditor()};

// ---- init ----
load();
if(!state.worlds.length){state.worlds.push({id:uid(),name:'我的第一个梦',color:'#7a5a9e',fragments:[],cards:[],elements:[]})}
cur=state.worlds[0].id;applyTheme(world());renderAll();
</script>
</body>
</html>
